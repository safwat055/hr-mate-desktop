plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'

    id 'com.gradleup.shadow' version '9.1.0'
    id 'org.graalvm.buildtools.native' version '0.11.1'
    id 'org.jetbrains.kotlin.jvm'
    id "org.jetbrains.kotlin.plugin.spring" version '2.4.0'

}

group = 'com.safwat'
version = '10.01'

repositories {
    mavenCentral()
}

def junitVersion = '5.12.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


application {

    mainClass = 'com.safwat.hr.Launcher'
}

javafx {
    version = '25.0.3'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.graphics', 'javafx.swing', 'javafx.media']
}
tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}
dependencies {

    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'net.synedra:validatorfx:0.6.1'

    implementation 'io.github.palexdev:materialfx:11.17.0'
    implementation 'org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.json:json:20240303'
    implementation 'org.springframework:spring-websocket:6.1.0'
    implementation 'org.springframework:spring-messaging:6.1.0'
    implementation 'jakarta.websocket:jakarta.websocket-api:2.1.1'
    implementation 'org.glassfish.tyrus:tyrus-client:2.1.3'
    implementation 'org.glassfish.tyrus:tyrus-container-grizzly-client:2.1.3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'org.webjars:sockjs-client:1.5.1'
    implementation 'org.webjars:stomp-websocket:2.3.4'
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.12.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.12.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

}

shadowJar {
    archiveBaseName.set('HR_Management')
    archiveVersion.set('')
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'com.safwat.hr.Launcher'
    }
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}



