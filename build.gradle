plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'

    id 'com.gradleup.shadow' version '9.1.0'
    id 'org.graalvm.buildtools.native' version '0.11.1'


}

group = 'com.safwat'
version = '10.01'

repositories {
    mavenCentral()
}

def junitVersion = '5.12.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


application {

    mainClass = 'com.safwat.hr.Launcher'
}

javafx {
    version = '25.0.3'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.graphics', 'javafx.swing', 'javafx.media']
}
tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}
dependencies {

    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'net.synedra:validatorfx:0.6.1'

    implementation 'io.github.palexdev:materialfx:11.17.0'
    implementation 'org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.json:json:20240303'
    implementation 'org.springframework:spring-websocket:6.1.0'
    implementation 'org.springframework:spring-messaging:6.1.0'
    implementation 'jakarta.websocket:jakarta.websocket-api:2.1.1'
    implementation 'org.glassfish.tyrus:tyrus-client:2.1.3'
    implementation 'org.glassfish.tyrus:tyrus-container-grizzly-client:2.1.3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation 'org.webjars:sockjs-client:1.5.1'
    implementation 'org.webjars:stomp-websocket:2.3.4'
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'ch.qos.logback:logback-classic:1.5.6'
}

shadowJar {
    archiveBaseName.set('hr-mate-desktop')
    archiveVersion.set('')
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'com.safwat.hr.Launcher'
    }
    mergeServiceFiles()
    configurations = [project.configurations.runtimeClasspath]
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


// ===============================
// jpackage Task - تغليف التطبيق
// ===============================
tasks.register('jpackageApp', Exec) {
    group = 'distribution'
    description = 'يغلف التطبيق باستخدام jpackage مع نسخ الموارد الضرورية'
    dependsOn shadowJar

    doFirst {
        // ---- تحديد نظام التشغيل ----
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

        // ---- المسارات الأساسية ----
        def buildDir      = layout.buildDirectory.get().asFile
        def jpackageInput = new File(buildDir, 'jpackage-input')
        def shadowJarFile = shadowJar.archiveFile.get().asFile

        // ---- مسار الأيقونة حسب نظام التشغيل ----
        def iconExt  = isWindows ? 'ico' : 'png'
        def iconDest = new File(buildDir, "logo.${iconExt}")

        // ---- تنظيف وإعداد مجلد الإدخال ----
        jpackageInput.deleteDir()
        jpackageInput.mkdirs()

        // ---- نسخ الـ shadow jar ----
        project.copy {
            from shadowJarFile
            into jpackageInput
        }

        // ---- استخراج الأيقونة من داخل الـ jar ----
        project.copy {
            from project.zipTree(shadowJarFile)
            include "com/safwat/hr/icons/logo.${iconExt}"
            into buildDir
            eachFile { fcd ->
                fcd.relativePath = new RelativePath(true, fcd.name)
            }
            includeEmptyDirs = false
        }

        // ---- بناء أمر jpackage بدون --app-content ----
        def jpackageExe = "${System.getProperty('java.home')}/bin/jpackage"

        commandLine([
            jpackageExe,
            '--type'        , 'app-image',
            '--name'        , 'hr-mate',
            '--app-version' , version.toString(),
            '--input'       , jpackageInput.absolutePath,
            '--main-jar'    , shadowJarFile.name,
            '--main-class'  , 'com.safwat.hr.Launcher',
            '--dest'        , new File(buildDir, 'jpackage-output').absolutePath,
            '--icon'        , iconDest.absolutePath,
        ])
    }

    doLast {
        // ---- نسخ subresource بعد ما jpackage يخلص للمسار الصح ----
        def isWindows     = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def buildDir      = layout.buildDirectory.get().asFile
        def appImageRoot  = new File(buildDir, 'jpackage-output/hr-mate')

        // Linux: bin/app/   |   Windows: app/
        def targetAppDir = isWindows
            ? new File(appImageRoot, 'app')
            : new File(appImageRoot, 'bin/app')

        targetAppDir.mkdirs()

        def subresourceRoot = file('subresource')
        if (!subresourceRoot.exists()) {
            subresourceRoot = file('src/main/resources/subresource')
        }

        if (subresourceRoot.exists()) {
            project.copy {
                from subresourceRoot        // elevate.exe + pdfjs/
                into targetAppDir           // → bin/app/elevate.exe + bin/app/pdfjs/...
            }
            logger.lifecycle("✅ تم نسخ subresource إلى: ${targetAppDir.absolutePath}")
        } else {
            logger.warn("⚠️  مجلد subresource مش موجود: ${subresourceRoot.absolutePath}")
        }
    }
}